<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Inter,sans-serif}
.slide{width:1080px;height:1920px;position:relative;overflow:hidden;color:#fff}
.rays{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 32%,rgba(255,255,255,.07) 0deg 4deg,transparent 4deg 12deg);pointer-events:none}
.dots{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.10) 2.2px,transparent 2.8px) 0 0/24px 24px;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 45%,transparent 70%,#000 100%);pointer-events:none}
.stroke{text-shadow:0 4px 0 #000,0 -4px 0 #000,4px 0 0 #000,-4px 0 0 #000,4px 4px 0 #000,-4px 4px 0 #000,4px -4px 0 #000,-4px -4px 0 #000,0 14px 30px rgba(0,0,0,.6)}
/* header */
.head{position:absolute;top:96px;left:64px;right:64px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.tag{background:#fff;color:#111;font-weight:900;font-size:30px;letter-spacing:1px;padding:14px 26px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.clueN{background:#ffd34d;color:#111;font-weight:900;font-size:34px;padding:14px 26px;border-radius:16px;border:4px solid #111;transform:rotate(3deg);box-shadow:6px 6px 0 #111}
/* illustration */
.art{position:absolute;left:0;top:210px;width:1080px;height:960px}
/* clue card */
.card{position:absolute;left:58px;width:870px;top:1170px;z-index:5;transform:rotate(-1.6deg)}
.paper{background:#f4e4c1;color:#2b1a0e;padding:58px 56px 54px;box-shadow:12px 14px 0 rgba(0,0,0,.55);
  clip-path:polygon(0 3%,4% 0,11% 2%,19% 0,28% 2.5%,37% .5%,46% 2%,55% 0,64% 2.5%,73% .5%,82% 2%,91% 0,100% 2%,99% 22%,100% 45%,98.8% 70%,100% 97%,92% 100%,83% 98%,74% 100%,64% 97.5%,54% 100%,44% 98%,34% 100%,24% 97.5%,14% 100%,5% 98%,0 100%,1% 75%,0 50%,1.2% 26%);
  background-image:radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.5),transparent 50%),radial-gradient(ellipse at 90% 90%,rgba(140,90,40,.25),transparent 55%)}
.ribbon{display:inline-block;background:#c8262c;color:#fff;font-weight:900;font-size:28px;letter-spacing:3px;padding:8px 18px;border-radius:6px;margin-bottom:22px}
.clue{font-weight:900;font-size:66px;line-height:1.08;letter-spacing:-1.5px}
.clue em{font-style:normal;color:#c8262c}
.rank{position:absolute;right:-18px;bottom:-40px;background:#111;color:#fff;font-weight:800;font-size:28px;padding:12px 20px;border-radius:14px;transform:rotate(4deg);border:3px solid #ffd34d}
.swipe{position:absolute;left:64px;top:1700px;font-weight:800;font-size:34px;color:rgba(255,255,255,.85);z-index:5}
.swipe b{color:#ffd34d}
</style></head>
<body>

<!-- 1. COVER -->
<section class="slide" id="s1" style="background:#000">
  <img src="cover_art.jpg" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.18) 26%,rgba(0,0,0,0) 40%,rgba(0,0,0,0) 62%,rgba(0,0,0,.7) 100%)"></div>
  <div class="dots" style="opacity:.5"></div>
  <div style="position:absolute;top:70px;left:0;right:0;text-align:center">
    <div class="tag" style="display:inline-block;font-size:30px">NARUTO EDITION 🍥</div>
    <div class="stroke" style="font-weight:900;font-size:118px;line-height:.92;letter-spacing:-4px;margin-top:26px;transform:rotate(-3deg)">GUESS THAT</div>
    <div class="stroke" style="font-weight:900;font-size:128px;line-height:1;letter-spacing:-4px;color:#ff8a1f;transform:rotate(-3deg);margin-top:4px">CHARACTER</div>
  </div>
  <div style="position:absolute;left:0;right:0;top:1360px;text-align:center"><div style="display:inline-block;background:#e8541e;color:#fff;font-weight:900;font-size:40px;padding:16px 30px;border-radius:16px;border:4px solid #111;box-shadow:8px 8px 0 #111;transform:rotate(2deg)">5 clues · hardest first 🧠</div></div>
  <div class="stroke" style="position:absolute;left:0;right:0;top:1520px;text-align:center;font-weight:900;font-size:52px;line-height:1.15">only REAL fans get it<br>on clue 1 👀</div>
  <div class="swipe" style="top:1720px;left:0;right:0;text-align:center">swipe <b>→</b></div>
</section>

<!-- 2. CLUE 1 (clue slides and final are built by build.py) -->
</body></html>
